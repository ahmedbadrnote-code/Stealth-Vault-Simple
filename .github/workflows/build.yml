name: Build Stealth Vault Simple APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Stable Debug Signing Key
        env:
          VAULT_KEYSTORE_BASE64: ${{ secrets.VAULT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VAULT_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: VAULT_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vaultsimple-signing"
          printf '%s' "$VAULT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks"
          test -s "$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks"
          echo "VAULT_KEYSTORE_FILE=$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks" >> "$GITHUB_ENV"

      - name: Build Debug APK with Stable Signature
        env:
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
        run: |
          if [ -z "$VAULT_KEYSTORE_PASSWORD" ] || [ -z "$VAULT_KEY_ALIAS" ] || [ -z "$VAULT_KEY_PASSWORD" ]; then
            echo "One or more stable signing secrets are missing."
            exit 1
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Generated APK Exists
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Vault-Simple-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
