name: Build Stealth Vault Simple APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build, Sign & Verify Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Persistent Signing Key
        env:
          VAULT_KEYSTORE_BASE64: ${{ secrets.VAULT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$VAULT_KEYSTORE_BASE64" ]; then
            echo "::error::Missing VAULT_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vaultsimple-signing"
          printf '%s' "$VAULT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks"
          test -s "$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks"
          echo "VAULT_KEYSTORE_FILE=$RUNNER_TEMP/vaultsimple-signing/vaultsimple-upload.jks" >> "$GITHUB_ENV"

      - name: Build Debug and Release APKs
        env:
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$VAULT_KEYSTORE_PASSWORD" ] || [ -z "$VAULT_KEY_ALIAS" ] || [ -z "$VAULT_KEY_PASSWORD" ]; then
            echo "::error::One or more persistent signing secrets are missing."
            exit 1
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Verify APK Signatures and Signing Identity
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          DEBUG_CERT=$("$APKSIGNER" verify --print-certs "$DEBUG_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          RELEASE_CERT=$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$DEBUG_CERT"
          test -n "$RELEASE_CERT"
          if [ "$DEBUG_CERT" != "$RELEASE_CERT" ]; then
            echo "::error::Debug and release APKs were signed with different certificates."
            exit 1
          fi
          echo "Verified identical debug/release signing certificate: $RELEASE_CERT"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Vault-Simple-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Vault-Simple-v1.0.0-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
